<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen Recorder</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1e1e1e;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .container {
    width: 400px;
    background: #2b2b2b;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  h1 {
    font-size: 18px;
    text-align: center;
    margin-bottom: 16px;
    color: #ccc;
    font-weight: 500;
  }

  .preview-container {
    background: #111;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 16px;
    aspect-ratio: 16/9;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .preview-container video {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .preview-placeholder {
    color: #555;
    font-size: 14px;
  }

  .timer {
    font-family: 'Courier New', monospace;
    font-size: 36px;
    font-weight: bold;
    text-align: center;
    margin: 12px 0;
    color: #fff;
  }

  .timer.recording { color: #e74c3c; }

  .status {
    text-align: center;
    padding: 8px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 13px;
  }

  .status.idle { background: #2b2b2b; color: #888; }
  .status.live { background: #3a1a1a; color: #f66; }
  .status.done { background: #1a3a1a; color: #6f6; }

  .buttons {
    display: flex;
    gap: 10px;
  }

  button {
    flex: 1;
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  #btnSelect {
    background: #3a3a3a;
    color: #fff;
    border: 1px solid #555;
  }
  #btnSelect:hover:not(:disabled) { background: #4a4a4a; }

  #btnRecord {
    background: #c0392b;
    color: #fff;
  }
  #btnRecord:hover:not(:disabled) { background: #e74c3c; }
  #btnRecord.stop { background: #e67e22; }
  #btnRecord.stop:hover { background: #f39c12; }

  .crop-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 10000;
    cursor: crosshair;
  }

  .crop-overlay canvas {
    width: 100%;
    height: 100%;
  }

  .hint {
    text-align: center;
    color: #555;
    font-size: 11px;
    margin-top: 12px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Screen Recorder</h1>

  <div class="preview-container">
    <video id="preview" autoplay muted playsinline></video>
    <span class="preview-placeholder" id="placeholder">No source selected</span>
  </div>

  <div class="timer" id="timer">00:00</div>
  <div class="status idle" id="status">Click "Select Source" to start</div>

  <div class="buttons">
    <button id="btnSelect">Select Source</button>
    <button id="btnRecord" disabled>Record</button>
  </div>

  <div class="hint">
    Use your browser's built-in picker to choose a screen, window, or tab.<br>
    Then crop the region in the preview if needed.
  </div>
</div>

<!-- Crop overlay -->
<div class="crop-overlay" id="cropOverlay">
  <canvas id="cropCanvas"></canvas>
</div>

<script>
(() => {
  const preview = document.getElementById('preview');
  const placeholder = document.getElementById('placeholder');
  const timerEl = document.getElementById('timer');
  const statusEl = document.getElementById('status');
  const btnSelect = document.getElementById('btnSelect');
  const btnRecord = document.getElementById('btnRecord');

  let sourceStream = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let recording = false;
  let timerInterval = null;
  let startTime = 0;

  // Crop state
  let cropRect = null; // {x, y, w, h} in source-video coordinates

  // --- Source selection ---
  btnSelect.addEventListener('click', async () => {
    try {
      if (sourceStream) {
        sourceStream.getTracks().forEach(t => t.stop());
      }
      sourceStream = await navigator.mediaDevices.getDisplayMedia({
        video: { cursor: 'always' },
        audio: false,
      });

      preview.srcObject = sourceStream;
      placeholder.style.display = 'none';
      btnRecord.disabled = false;
      cropRect = null;
      setStatus('Source selected — click Record', 'idle');

      sourceStream.getVideoTracks()[0].addEventListener('ended', () => {
        stopRecording();
        preview.srcObject = null;
        placeholder.style.display = '';
        btnRecord.disabled = true;
        setStatus('Source ended', 'idle');
      });
    } catch (e) {
      if (e.name !== 'NotAllowedError') {
        setStatus('Error: ' + e.message, 'live');
      }
    }
  });

  // --- Record / Stop ---
  btnRecord.addEventListener('click', () => {
    if (!recording) {
      startRecording();
    } else {
      stopRecording();
    }
  });

  function startRecording() {
    if (!sourceStream) return;

    // Get the video track settings for native resolution
    const track = sourceStream.getVideoTracks()[0];
    const settings = track.getSettings();
    const sourceW = settings.width;
    const sourceH = settings.height;

    let streamToRecord = sourceStream;

    // If crop is desired, use a canvas to crop
    if (cropRect) {
      const canvas = document.createElement('canvas');
      canvas.width = cropRect.w;
      canvas.height = cropRect.h;
      const ctx = canvas.getContext('2d');

      const tempVideo = document.createElement('video');
      tempVideo.srcObject = sourceStream;
      tempVideo.muted = true;
      tempVideo.play();

      const fps = settings.frameRate || 30;
      const drawInterval = setInterval(() => {
        if (!recording) { clearInterval(drawInterval); return; }
        ctx.drawImage(tempVideo,
          cropRect.x, cropRect.y, cropRect.w, cropRect.h,
          0, 0, cropRect.w, cropRect.h
        );
      }, 1000 / fps);

      streamToRecord = canvas.captureStream(fps);
    }

    recordedChunks = [];
    const mimeType = getSupportedMimeType();
    mediaRecorder = new MediaRecorder(streamToRecord, {
      mimeType,
      videoBitsPerSecond: 8_000_000,
    });

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: mimeType });
      downloadBlob(blob);
    };

    mediaRecorder.start(100);
    recording = true;
    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 250);
    timerEl.classList.add('recording');

    btnRecord.textContent = 'Stop';
    btnRecord.classList.add('stop');
    btnSelect.disabled = true;
    setStatus('Recording...', 'live');
  }

  function stopRecording() {
    if (!recording) return;
    recording = false;
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
    clearInterval(timerInterval);
    timerEl.classList.remove('recording');

    btnRecord.textContent = 'Record';
    btnRecord.classList.remove('stop');
    btnSelect.disabled = false;
    setStatus('Saved!', 'done');
  }

  function downloadBlob(blob) {
    const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    const ext = blob.type.includes('webm') ? 'webm' : 'mp4';
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `recording_${ts}.${ext}`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function getSupportedMimeType() {
    const types = [
      'video/webm;codecs=vp9',
      'video/webm;codecs=vp8',
      'video/webm',
      'video/mp4',
    ];
    return types.find(t => MediaRecorder.isTypeSupported(t)) || 'video/webm';
  }

  // --- Timer ---
  function updateTimer() {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    timerEl.textContent = `${m}:${s}`;
  }

  // --- Status ---
  function setStatus(text, type) {
    statusEl.textContent = text;
    statusEl.className = 'status ' + type;
  }
})();
</script>
</body>
</html>
